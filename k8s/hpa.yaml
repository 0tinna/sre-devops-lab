apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-api
  namespace: sre-lab
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 相对 requests.cpu=100m 的百分比，即 70m 触发扩容
          averageUtilization: 70
  behavior:
    # 扩容要快：CPU 打高就立刻加副本
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    # 缩容要慢：避免流量抖动导致反复扩缩
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
