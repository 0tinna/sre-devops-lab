apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/part-of: sre-devops-lab
    spec:
      hostNetwork: true
      hostPID: true
      # 两个节点都要采集，包括带 NoSchedule taint 的 master
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: docker.m.daocloud.io/prom/node-exporter:v1.9.1
          args:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--path.rootfs=/host/root'
            - '--web.listen-address=0.0.0.0:9100'
            - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)'
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-sre-lab
rules:
  - apiGroups: ['']
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ['list', 'watch']
  - apiGroups: ['apps']
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ['list', 'watch']
  - apiGroups: ['batch']
    resources:
      - cronjobs
      - jobs
    verbs: ['list', 'watch']
  - apiGroups: ['autoscaling']
    resources:
      - horizontalpodautoscalers
    verbs: ['list', 'watch']
  - apiGroups: ['policy']
    resources:
      - poddisruptionbudgets
    verbs: ['list', 'watch']
  - apiGroups: ['storage.k8s.io']
    resources:
      - storageclasses
      - volumeattachments
    verbs: ['list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - ingresses
      - networkpolicies
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-sre-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-sre-lab
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: sre-devops-lab
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        kubernetes.io/hostname: master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          # registry.k8s.io 会 307 到 europe-west3-docker.pkg.dev，本环境 DNS 解析失败，
          # 改用 daocloud 的 k8s 镜像源；等价于 registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          image: k8s.m.daocloud.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args:
            - '--port=8080'
            - '--telemetry-port=8081'
            # 注意：--resources 是白名单，不在列表里的资源完全不会产生指标。
            # 这里必须包含 horizontalpodautoscalers 和 poddisruptionbudgets，
            # 否则依赖它们的告警表达式（HPAMaxedOut / HPAUnableToScale / PDBBlocksMaintenance）
            # 会静默失效——指标不存在，告警永远不会触发，但规则看起来完全正常。
            - '--resources=pods,deployments,replicasets,statefulsets,daemonsets,nodes,namespaces,services,endpoints,persistentvolumes,persistentvolumeclaims,jobs,cronjobs,horizontalpodautoscalers,poddisruptionbudgets'
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # v2.16 的探针端点分布与直觉不同，实测结果：
          #   8080(http-metrics): /healthz 200, /livez 200, /readyz 404
          #   8081(telemetry)   : /readyz 200, /healthz 404, /livez 404
          # 就绪探针必须走 8081 的 /readyz，否则 Pod 永远 NotReady，Service 没有 Endpoint。
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
