apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: sre-lab
        environment: lab

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: alertmanager
        static_configs:
          - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

      # 业务应用：靠 Pod 注解 prometheus.io/scrape 自动发现
      - job_name: demo-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['sre-lab']
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_annotation_prometheus_io_scrape']
            action: keep
            regex: 'true'
          - source_labels: ['__meta_kubernetes_pod_annotation_prometheus_io_path']
            action: replace
            target_label: '__metrics_path__'
            regex: '(.+)'
          - source_labels: ['__address__', '__meta_kubernetes_pod_annotation_prometheus_io_port']
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: '__address__'
          - source_labels: ['__meta_kubernetes_namespace']
            target_label: namespace
          - source_labels: ['__meta_kubernetes_pod_name']
            target_label: pod
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_name']
            target_label: app

      # 节点指标：node-exporter 以 hostNetwork + hostPort 9100 暴露
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: ['__address__']
            action: replace
            regex: '(.+):(\d+)'
            replacement: '$1:9100'
            target_label: '__address__'
          - source_labels: ['__meta_kubernetes_node_name']
            target_label: node

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      # Loki 自身指标。
      # 不采这个，LokiNotReceivingLogs 告警引用的
      # loki_distributor_lines_received_total 就永远不存在 —— 死告警。
      - job_name: loki
        static_configs:
          - targets: ['loki.monitoring.svc.cluster.local:3100']

      # cAdvisor：容器级 CPU/内存。
      # 走 apiserver 代理（/api/v1/nodes/<node>/proxy/...），
      # 这样不需要直连 kubelet 的 10250 端口，也不需要额外证书配置，
      # 只需要 ServiceAccount 有 nodes/proxy 权限（RBAC 里已有）。
      - job_name: kubelet-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: '__address__'
            replacement: 'kubernetes.default.svc:443'
          - source_labels: ['__meta_kubernetes_node_name']
            regex: '(.+)'
            target_label: '__metrics_path__'
            replacement: '/api/v1/nodes/${1}/proxy/metrics/cadvisor'
          - source_labels: ['__meta_kubernetes_node_name']
            target_label: node

      # kubelet 自身指标，含 kubelet_image_pull_duration_seconds，
      # 用于观察镜像拉取耗时（镜像分发热点，见 docs/6-operation-log.md 18.4）。
      - job_name: kubelet
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: '__address__'
            replacement: 'kubernetes.default.svc:443'
          - source_labels: ['__meta_kubernetes_node_name']
            regex: '(.+)'
            target_label: '__metrics_path__'
            replacement: '/api/v1/nodes/${1}/proxy/metrics'
          - source_labels: ['__meta_kubernetes_node_name']
            target_label: node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  sre-lab-alerts.yml: |
    groups:
      - name: availability
        rules:
          # 监控目标不可用：任何 job 有 target down 超过 1 分钟
          - alert: TargetDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '监控目标不可用 {{ $labels.job }} / {{ $labels.instance }}'
              description: 'Prometheus 连续 1 分钟无法抓取该目标，服务可能不可用。'

          # 可用副本不足
          - alert: DeploymentReplicasMismatch
            expr: |
              kube_deployment_status_replicas_available
                < kube_deployment_spec_replicas
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 副本不足'
              description: '期望 {{ $value }} 个可用副本，实际不可用：可用副本低于期望值持续 2 分钟。'

          # Pod 处于非 Running 状态
          - alert: PodNotReady
            expr: |
              kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} 状态异常'
              description: 'Pod 已处于 {{ $labels.phase }} 超过 2 分钟。'

          # PDB 的 allowed disruptions 为 0：可用性没问题，但维护能力已经丧失。
          # 这类故障不影响任何实时指标，只有真去 drain/升级时才暴露
          # （演练场景 11，见 docs/drills/answers.md 的 S11）。
          # 依赖 kube_poddisruptionbudget_status_pod_disruptions_allowed，
          # 该指标只有在 kube-state-metrics 的 --resources 里包含
          # poddisruptionbudgets 时才存在，否则本告警是死的。
          - alert: PDBBlocksMaintenance
            expr: |
              kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace="sre-lab"} <= 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: 'PDB {{ $labels.poddisruptionbudget }} 不允许任何中断'
              description: 'minAvailable 可能被设成等于副本数，节点维护与滚动升级都会被永久阻塞。'

      - name: reliability
        rules:
          # 5xx 比例过高
          # 分母刻意排除探针与指标端点：healthz/readyz 的高频 200 会把业务错误率稀释掉，
          # 例如探针 0.3 rps + 业务 1 rps 时，业务 100% 失败也只显示 77%。
          - alert: DemoApiHighErrorRate
            expr: |
              (
                sum(rate(demo_http_requests_total{status=~"5..",path!~"/healthz|/readyz|/metrics"}[2m]))
                /
                (sum(rate(demo_http_requests_total{path!~"/healthz|/readyz|/metrics"}[2m])) > 0)
              ) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'demo-api 5xx 比例过高'
              description: '最近 2 分钟业务请求中 5xx 占比超过 5%（已排除探针端点）。'

          # P95 延迟过高
          - alert: DemoApiHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(demo_http_request_duration_seconds_bucket[5m]))
              ) > 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: 'demo-api P95 延迟超过 1s'
              description: '最近 5 分钟 P95 请求延迟为 {{ $value | humanizeDuration }}。'

          # Pod 重启过于频繁
          - alert: PodRestartTooOften
            expr: |
              increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} 频繁重启'
              description: '15 分钟内重启次数超过 3 次，检查容器退出原因与 OOM。'

          # 容器 OOM 被杀
          # 注意：kube_pod_container_status_last_terminated_reason 只在容器
          # **曾经终止过** 时才存在。当前没有容器重启时这条指标为空，
          # 告警不触发是正确的，不要误判为"指标缺失"。
          - alert: ContainerOOMKilled
            expr: |
              kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '容器 {{ $labels.container }} 曾因 OOM 被杀'
              description: '内存 limit 可能过小，或应用存在内存泄漏。'

          # 镜像拉取失败：Tag 写错、仓库不可达、认证失败。
          # 演练场景 5 就靠这条。同理，waiting_reason 指标只在
          # 容器真的处于等待状态时才出现。
          - alert: PodImagePullFailed
            expr: |
              kube_pod_container_status_waiting_reason{
                reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"
              } > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} 镜像拉取失败'
              description: '原因 {{ $labels.reason }}。检查镜像 tag 是否存在、仓库是否可达。'

          # cgroup 级别的 OOM 事件。
          # 比 ContainerOOMKilled 更可靠：后者依赖容器重启，
          # 而 gunicorn 这类多 worker 应用里，OOM 只杀掉一个 worker，
          # master 会立刻补位，容器根本不重启 —— 那条告警抓不到。
          - alert: ContainerOOMEvents
            expr: |
              increase(container_oom_events_total{namespace="sre-lab"}[5m]) > 0
            labels:
              severity: critical
            annotations:
              summary: '容器 {{ $labels.pod }}/{{ $labels.container }} 发生 OOM'
              description: 'cgroup 内存超限触发了 OOM killer，即使容器没重启也要处理。'

      - name: capacity
        rules:
          # 镜像拉取耗时：kubelet 的 histogram，反映"调度到新节点时的启动延迟"。
          # 镜像没预热时这一步会吃掉几分钟，把故障转移时间放大数倍
          # （实测 drain 从 7s 变成 4min 超时，见 docs/6-operation-log.md 18.4）。
          - alert: ImagePullSlow
            expr: |
              histogram_quantile(
                0.9,
                sum by (node, le) (rate(kubelet_image_pull_duration_seconds_bucket[30m]))
              ) > 120
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: '节点 {{ $labels.node }} 镜像拉取 P90 超过 120 秒'
              description: '考虑预热镜像或使用内网 registry：./scripts/prewarm-image.sh'

          # 节点内存压力
          - alert: NodeMemoryPressure
            expr: |
              (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '节点 {{ $labels.node }} 内存使用率超过 90%'
              description: '可用内存不足 10%，工作节点仅 3.6 GiB，注意调度。'

          # 节点磁盘压力
          - alert: NodeDiskPressure
            expr: |
              (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '节点 {{ $labels.node }} 磁盘 {{ $labels.mountpoint }} 使用率超过 85%'
              description: '磁盘剩余空间不足，镜像与日志可能堆积。'

          # 节点 CPU 饱和
          - alert: NodeHighCPU
            expr: |
              (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
            for: 10m
            labels:
              severity: info
            annotations:
              summary: '节点 {{ $labels.node }} CPU 使用率超过 85%'
              description: '持续 10 分钟高于 85%，检查是否有异常负载。'

          # 日志采集器掉线：DaemonSet 就绪数少于期望数
          - alert: LogCollectorDown
            expr: |
              kube_daemonset_status_number_ready{namespace="monitoring", daemonset="fluent-bit"}
                < kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="fluent-bit"}
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: '日志采集器 {{ $labels.daemonset }} 副本不足'
              description: '就绪副本少于期望数，部分节点的日志将不再上报到 Loki。'

          # 日志管道停滞：所有采集器都在，但 Loki 长时间没有新日志写入
          # 用 Loki 自身的 ingestion 指标判断，避免误报（应用真的静默时也会命中）
          - alert: LokiNotReceivingLogs
            expr: |
              sum(rate(loki_distributor_lines_received_total[15m])) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Loki 近 15 分钟没有收到任何日志'
              description: '采集器可能正常但上游无日志，或写入链路中断。结合 LogCollectorDown 判断。'

      - name: autoscaling
        rules:
          # HPA 达到最大副本上限：扩不动了，说明容量规划需要调整
          # for 设为 5m 而不是 10m：实测压测 6.5 分钟就会触顶，
          # 10 分钟的等待会让告警错过整个压测窗口。
          - alert: HPAMaxedOut
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas{namespace="sre-lab"}
                >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="sre-lab"}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'HPA {{ $labels.horizontalpodautoscaler }} 已达最大副本数'
              description: '持续 5 分钟顶在上限，负载可能超过预期，或 maxReplicas 需要调整。'

          # HPA 无法获取指标：metrics-server 或 metrics API 出问题
          - alert: HPAUnableToScale
            expr: |
              kube_horizontalpodautoscaler_status_condition{
                namespace="sre-lab", condition="AbleToScale", status="false"
              } == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'HPA {{ $labels.horizontalpodautoscaler }} 无法扩缩容'
              description: '检查 metrics-server、APIService 与 Pod 的 resources.requests。'

          # Pod 接近 CPU limit：说明在限流边缘，性能会劣化
          - alert: PodCPUNearLimit
            expr: |
              sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="sre-lab", container!=""}[5m]))
                / sum by (pod) (kube_pod_container_resource_limits{namespace="sre-lab", resource="cpu"})
                > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Pod {{ $labels.pod }} CPU 接近 limit'
              description: '超过 limit 会被 CFS 限流，表现为延迟尖刺而非 OOM。'

          # 内存接近 limit：下一步就是 OOMKilled
          - alert: PodMemoryNearLimit
            expr: |
              sum by (pod) (container_memory_working_set_bytes{namespace="sre-lab", container!=""})
                / sum by (pod) (kube_pod_container_resource_limits{namespace="sre-lab", resource="memory"})
                > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Pod {{ $labels.pod }} 内存超过 limit 的 90%'
              description: '接近 OOMKilled 阈值，提前介入比事后重启好。'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: sre-devops-lab
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        kubernetes.io/hostname: master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.m.daocloud.io/prom/prometheus:v3.6.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=6h'
            - '--storage.tsdb.retention.size=1GB'
            - '--web.enable-lifecycle'
            - '--web.listen-address=:9090'
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
