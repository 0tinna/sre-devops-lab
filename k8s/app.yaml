apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: sre-lab
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/part-of: sre-devops-lab
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/metrics'
    spec:
      # 关键业务：节点资源紧张时优先保留
      priorityClassName: sre-lab-critical
      # 优雅终止：给 gunicorn 时间处理完在途请求。
      # preStop sleep 让 Endpoint 先摘除，避免请求打到正在关闭的 Pod；
      # 总时长 = preStop 5s + 应用自身退出时间，留 30s 余量。
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # worker 节点不可用时的兜底：允许调度到控制面。
      # 实验环境只有 1 个 worker，不加这个 toleration 就是单点。
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          # 正常情况下只去 worker，master 仅作为故障兜底
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # 副本尽量分散到不同节点；只有 1 个可用节点时允许不满足（ScheduleAnyway）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-api
      containers:
        - name: demo-api
          image: ghcr.io/0tinna/sre-devops-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            # 实验环境显式开启受控故障端点（/simulate/*），用于 P2 故障演练。
            # 真实环境应设为 0 或整段移除。
            - name: ENABLE_FAULT_ENDPOINTS
              value: '1'
            # prometheus_client 多进程模式：gunicorn 多 worker 下共享计数器。
            # 不设置会让 /metrics 在 worker 之间抖动，rate() 出现伪 reset。
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            - name: GUNICORN_WORKERS
              value: '2'
            - name: GUNICORN_THREADS
              value: '2'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # startupProbe 保护启动阶段：最长容忍 60 秒（30 × 2s）。
          # 启动期间 liveness 不会介入，避免"启动慢被当成挂了"。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # 等 kube-proxy 完成 Endpoint 摘除，再让进程退出
                command: ['/bin/sh', '-c', 'sleep 5']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: multiproc
              mountPath: /tmp/prometheus-multiproc
      volumes:
        - name: multiproc
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: sre-lab
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: sre-devops-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
